<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anteprima Logo CondoSmart - Precisione Origine</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-light: #ffffff;
      --accent: #2563eb;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Sora', sans-serif;
      background: var(--bg-dark);
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      text-align: center;
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      padding: 3rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      transition: background 0.3s, border 0.3s;
    }

    .light-mode .container {
      background: rgba(248, 250, 252, 0.8);
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
    }

    /* ─── CONTROLLI ─── */
    .controls {
      margin-bottom: 2rem;
      display: flex;
      gap: 1rem;
    }

    button {
      font-family: 'Sora', sans-serif;
      font-weight: 600;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #1e293b;
      color: #f1f5f9;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    button:hover {
      background: #334155;
      transform: translateY(-1px);
    }

    .light-mode button {
      background: #f1f5f9;
      color: #1e293b;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    .light-mode button:hover {
      background: #cbd5e1;
    }

    /* ─── STILI LOGO ANIMATO ─── */
    .condosmart-logo-container {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      perspective: 1000px;
      padding: 10px 20px;
      border-radius: 12px;
      transition: all 0.3s;
    }

    .condosmart-logo-container:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .light-mode .condosmart-logo-container:hover {
      background: rgba(0, 0, 0, 0.02);
    }

    .condosmart-icon {
      display: inline-block;
      vertical-align: middle;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .condosmart-logo-container:hover .condosmart-icon {
      transform: scale(1.08) translateY(-2px);
    }

    /* Effetto 3D isometrico sui condomini all'hover */
    .tower-left, .tower-center, .tower-right {
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .condosmart-logo-container:hover .tower-left {
      transform: translateY(-3px) translateX(-1px);
    }

    .condosmart-logo-container:hover .tower-center {
      transform: translateY(-6px);
    }

    .condosmart-logo-container:hover .tower-right {
      transform: translateY(-4.5px) translateX(1.5px);
    }

    .condosmart-logo-container:hover .smart-flow-line {
      filter: drop-shadow(0 0 5px rgba(236, 72, 153, 0.8));
      stroke-width: 5.5px;
    }

    /* ─── ANIMAZIONE FOGLI VOLANTI CON TRAIETTORIE OSCILLANTI (WAVE/PLANATA) ─── */
    .condosmart-logo-container:hover .sheet-1 {
      animation: fly-sheet-1 2.4s infinite ease-in-out;
    }

    .condosmart-logo-container:hover .sheet-2 {
      animation: fly-sheet-2 2.4s infinite ease-in-out 0.4s;
    }

    .condosmart-logo-container:hover .sheet-3 {
      animation: fly-sheet-3 2.4s infinite ease-in-out 0.8s;
    }

    @keyframes fly-sheet-1 {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(0);
        opacity: 0;
      }
      6% {
        transform: translate(0, 0) rotate(5deg) scale(1);
        opacity: 1;
      }
      25% {
        transform: translate(calc(var(--logo-size) * 0.2), calc(var(--logo-size) * -0.12)) rotate(20deg) scale(1.2);
        opacity: 1;
      }
      50% {
        transform: translate(calc(var(--logo-size) * 0.6), calc(var(--logo-size) * 0.05)) rotate(-15deg) scale(1.1);
        opacity: 1;
      }
      75% {
        transform: translate(calc(var(--logo-size) * 1.15), calc(var(--logo-size) * -0.1)) rotate(25deg) scale(0.95);
        opacity: 1;
      }
      90% {
        transform: translate(calc(var(--logo-size) * 1.04), calc(var(--logo-size) * -0.07)) rotate(0deg) scale(0.5);
        opacity: 0.8;
      }
      100% {
        transform: translate(calc(var(--logo-size) * 1.06), calc(var(--logo-size) * -0.07)) rotate(0deg) scale(0.2);
        opacity: 0;
      }
    }

    @keyframes fly-sheet-2 {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(0);
        opacity: 0;
      }
      6% {
        transform: translate(0, 0) rotate(-5deg) scale(1);
        opacity: 1;
      }
      25% {
        transform: translate(calc(var(--logo-size) * 0.22), calc(var(--logo-size) * -0.16)) rotate(-25deg) scale(1.2);
        opacity: 1;
      }
      55% {
        transform: translate(calc(var(--logo-size) * 0.75), calc(var(--logo-size) * 0.02)) rotate(20deg) scale(1.1);
        opacity: 1;
      }
      80% {
        transform: translate(calc(var(--logo-size) * 1.25), calc(var(--logo-size) * -0.08)) rotate(-10deg) scale(0.95);
        opacity: 1;
      }
      92% {
        transform: translate(calc(var(--logo-size) * 1.59), calc(var(--logo-size) * -0.04)) rotate(90deg) scale(0.5);
        opacity: 0.8;
      }
      100% {
        transform: translate(calc(var(--logo-size) * 1.62), calc(var(--logo-size) * -0.04)) rotate(90deg) scale(0.2);
        opacity: 0;
      }
    }

    @keyframes fly-sheet-3 {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(0);
        opacity: 0;
      }
      6% {
        transform: translate(0, 0) rotate(0deg) scale(1);
        opacity: 1;
      }
      25% {
        transform: translate(calc(var(--logo-size) * 0.15), calc(var(--logo-size) * -0.08)) rotate(15deg) scale(1.2);
        opacity: 1;
      }
      50% {
        transform: translate(calc(var(--logo-size) * 0.5), calc(var(--logo-size) * 0.15)) rotate(-25deg) scale(1.1);
        opacity: 1;
      }
      75% {
        transform: translate(calc(var(--logo-size) * 1.1), calc(var(--logo-size) * 0.05)) rotate(20deg) scale(0.95);
        opacity: 1;
      }
      92% {
        transform: translate(calc(var(--logo-size) * 0.98), calc(var(--logo-size) * 0.12)) rotate(-110deg) scale(0.5);
        opacity: 0.8;
      }
      100% {
        transform: translate(calc(var(--logo-size) * 1.0), calc(var(--logo-size) * 0.12)) rotate(-110deg) scale(0.2);
        opacity: 0;
      }
    }

    /* ─── VARIABILI TEMA E REAZIONE SCRITTA ─── */
    .condosmart-logo-container {
      --logo-text-prefix: #f1f5f9;
      --logo-text-suffix: #60a5fa;
      --logo-text-highlight: #ffffff;
      --logo-text-glow: rgba(255, 255, 255, 0.4);
      --logo-text-suffix-glow: rgba(96, 165, 250, 0.8);
      --logo-text-suffix-highlight: #93c5fd;
    }

    .light-mode .condosmart-logo-container {
      --logo-text-prefix: #1e293b;
      --logo-text-suffix: #2563eb;
      --logo-text-highlight: #0f172a;
      --logo-text-glow: rgba(37, 99, 235, 0.25);
      --logo-text-suffix-glow: rgba(37, 99, 235, 0.5);
      --logo-text-suffix-highlight: #1d4ed8;
    }

    .condosmart-logo-text {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      line-height: 1;
    }

    .text-prefix {
      color: var(--logo-text-prefix);
      display: inline-block;
      transition: color 0.3s, text-shadow 0.3s, transform 0.3s;
    }

    .text-suffix {
      color: var(--logo-text-suffix);
      display: inline-block;
      margin-left: 0.05em;
      transition: color 0.3s, text-shadow 0.3s, transform 0.3s;
    }

    /* ─── REAZIONE DELLA SCRITTA ─── */
    .condosmart-logo-container:hover .text-prefix {
      animation: receive-docs-prefix 2.4s infinite ease-in-out;
    }

    .condosmart-logo-container:hover .text-suffix {
      animation: receive-docs-suffix 2.4s infinite ease-in-out;
    }

    @keyframes receive-docs-prefix {
      0% {
        color: var(--logo-text-prefix);
        text-shadow: none;
        transform: translateY(0) scale(1);
      }
      13.3% {
        color: var(--logo-text-highlight);
        text-shadow: 0 0 10px var(--logo-text-glow);
        transform: translateY(-1px);
      }
      25% {
        color: var(--logo-text-prefix);
        text-shadow: none;
        transform: translateY(0) scale(1);
      }
      80% {
        color: var(--logo-text-highlight);
        text-shadow: 0 0 10px var(--logo-text-glow);
        transform: translateY(-1px);
      }
      92% {
        color: var(--logo-text-prefix);
        text-shadow: none;
        transform: translateY(0) scale(1);
      }
      100% {
        color: var(--logo-text-prefix);
        text-shadow: none;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes receive-docs-suffix {
      0%, 100% {
        color: var(--logo-text-suffix-highlight);
        text-shadow: 0 0 18px var(--logo-text-suffix-glow), 0 0 28px rgba(6, 182, 212, 0.4);
        transform: translateY(-1.5px) scale(1.03);
      }
      12% {
        color: var(--logo-text-suffix);
        text-shadow: 0 0 8px rgba(96, 165, 250, 0.2);
        transform: translateY(0) scale(1);
      }
      90% {
        color: var(--logo-text-suffix);
        text-shadow: 0 0 8px rgba(96, 165, 250, 0.2);
        transform: translateY(0) scale(1);
      }
    }

    .desc {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #94a3b8;
      max-width: 380px;
      line-height: 1.5;
    }

    .light-mode .desc {
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="controls">
    <button id="toggleBg">Cambia Tema (Chiaro/Scuro)</button>
  </div>

  <div class="container">
    <div class="condosmart-logo-container interactive" style="--logo-size: 96px;">
      <svg
        width="96"
        height="96"
        viewBox="0 0 100 100"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        class="condosmart-icon"
        style="overflow: visible;"
      >
        <defs>
          <linearGradient id="logoWallLight" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa" />
            <stop offset="100%" stop-color="#2563eb" />
          </linearGradient>
          
          <linearGradient id="logoWallDark" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1d4ed8" />
            <stop offset="100%" stop-color="#1e3a8a" />
          </linearGradient>
          
          <linearGradient id="logoWallHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#06b6d4" />
            <stop offset="100%" stop-color="#3b82f6" />
          </linearGradient>
          
          <linearGradient id="logoSmartFlow" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#c084fc" />
            <stop offset="50%" stop-color="#f472b6" />
            <stop offset="100%" stop-color="#60a5fa" />
          </linearGradient>

          <filter id="logoNeonGlow" x="-25%" y="-25%" width="150%" height="150%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        <!-- Torre 1 (Sinistra, Bassa) -->
        <g class="tower-left">
          <path d="M 20 55 L 35 63 L 35 85 L 20 77 Z" fill="url(#logoWallDark)" />
          <path d="M 35 63 L 50 55 L 50 77 L 35 85 Z" fill="url(#logoWallLight)" />
          <path d="M 20 55 L 35 47 L 50 55 L 35 63 Z" fill="url(#logoWallHighlight)" />
          
          <!-- Finestre -->
          <g fill="#e0f2fe" opacity="0.95">
            <path d="M 23 63 L 26 64.6 L 26 68.6 L 23 67 Z" opacity="0.9" fill="#38bdf8" />
            <path d="M 28 65.7 L 31 67.3 L 31 71.3 L 28 69.7 Z" opacity="0.5" />
          </g>
        </g>

        <!-- Torre 2 (Centro, Media) -->
        <g class="tower-center">
          <path d="M 38 38 L 53 46 L 53 78 L 38 70 Z" fill="url(#logoWallDark)" />
          <path d="M 53 46 L 68 38 L 68 70 L 53 78 Z" fill="url(#logoWallLight)" />
          <path d="M 38 38 L 53 30 L 68 38 L 53 46 Z" fill="url(#logoWallHighlight)" opacity="0.95" />
          
          <!-- Finestre -->
          <g fill="#e0f2fe" opacity="0.95">
            <path d="M 41 46 L 44 47.6 L 44 51.6 L 41 50 Z" opacity="0.9" />
            <path d="M 46 48.7 L 49 50.3 L 49 54.3 L 46 52.7 Z" opacity="0.45" />
            <path d="M 41 54 L 44 55.6 L 44 59.6 L 41 58 Z" opacity="0.8" fill="#38bdf8" />
            <path d="M 46 56.7 L 49 58.3 L 49 62.3 L 46 60.7 Z" opacity="0.9" />
          </g>
        </g>

        <!-- Torre 3 (Destra, Alta) -->
        <g class="tower-right">
          <path d="M 56 25 L 71 33 L 71 68 L 56 60 Z" fill="url(#logoWallDark)" />
          <path d="M 71 33 L 86 25 L 86 60 L 71 68 Z" fill="url(#logoWallLight)" />
          <path d="M 56 25 L 71 17 L 86 25 L 71 33 Z" fill="url(#logoWallHighlight)" opacity="0.9" />
          
          <!-- Finestre -->
          <g fill="#e0f2fe" opacity="0.95">
            <path d="M 59 33 L 62 34.6 L 62 38.6 L 59 37 Z" opacity="0.9" />
            <path d="M 64 35.7 L 67 37.3 L 67 41.3 L 64 39.7 Z" opacity="0.4" />
            <path d="M 59 41 L 62 42.6 L 62 46.6 L 59 45 Z" opacity="0.8" fill="#38bdf8" />
            <path d="M 64 43.7 L 67 45.3 L 67 49.3 L 64 47.7 Z" opacity="0.9" />
            <path d="M 59 49 L 62 50.6 L 62 54.6 L 59 53 Z" opacity="0.5" />
            <path d="M 64 51.7 L 67 53.3 L 67 57.3 L 64 55.7 Z" opacity="0.85" />
          </g>
        </g>

        <!-- Onda Smart -->
        <path
          d="M 12 73 C 32 93, 68 93, 88 53"
          stroke="url(#logoSmartFlow)"
          stroke-width="4.5"
          stroke-linecap="round"
          filter="url(#logoNeonGlow)"
          class="smart-flow-line"
        />

        <!-- Fogli di carta volanti (Nuovi tracciati assunti dal viewBox) -->
        <!-- Foglio 1: esce dall'intercapedine tra Torre 1 e 2 (X=36.5, Y=52) -->
        <g class="fly-sheet sheet-1" style="opacity: 0;">
          <path d="M 36.5 52 L 42 52 L 44 54 L 44 62 L 36.5 62 Z" fill="#ffffff" stroke="#2563eb" stroke-width="0.4" />
          <path d="M 42 52 L 42 54 L 44 54 Z" fill="#cbd5e1" stroke="#2563eb" stroke-width="0.4" />
          <line x1="38" y1="55.5" x2="42.5" y2="55.5" stroke="#94a3b8" stroke-width="0.4" />
          <line x1="38" y1="57.5" x2="42.5" y2="57.5" stroke="#94a3b8" stroke-width="0.4" />
          <line x1="38" y1="59.5" x2="41" y2="59.5" stroke="#94a3b8" stroke-width="0.4" />
        </g>

        <!-- Foglio 2: esce esattamente da una finestra illuminata (X=44, Y=48.7) -->
        <g class="fly-sheet sheet-2" style="opacity: 0;">
          <path d="M 44 48.7 L 49.5 48.7 L 51.5 50.7 L 51.5 58.7 L 44 58.7 Z" fill="#ffffff" stroke="#06b6d4" stroke-width="0.4" />
          <path d="M 49.5 48.7 L 49.5 50.7 L 51.5 50.7 Z" fill="#cbd5e1" stroke="#06b6d4" stroke-width="0.4" />
          <line x1="45.5" y1="52.2" x2="50" y2="52.2" stroke="#94a3b8" stroke-width="0.4" />
          <line x1="45.5" y1="54.2" x2="49" y2="54.2" stroke="#94a3b8" stroke-width="0.4" />
          <line x1="45.5" y1="56.2" x2="50" y2="56.2" stroke="#94a3b8" stroke-width="0.4" />
        </g>

        <!-- Foglio 3: esce dall'intercapedine tra Torre 2 e 3 (X=54.5, Y=33) -->
        <g class="fly-sheet sheet-3" style="opacity: 0;">
          <path d="M 54.5 33 L 60 33 L 62 35 L 62 43 L 54.5 43 Z" fill="#ffffff" stroke="#c084fc" stroke-width="0.4" />
          <path d="M 60 33 L 60 35 L 62 35 Z" fill="#cbd5e1" stroke="#c084fc" stroke-width="0.4" />
          <line x1="56" y1="36.5" x2="60.5" y2="36.5" stroke="#94a3b8" stroke-width="0.4" />
          <line x1="56" y1="38.5" x2="60.5" y2="38.5" stroke="#94a3b8" stroke-width="0.4" />
          <line x1="56" y1="40.5" x2="59" y2="40.5" stroke="#94a3b8" stroke-width="0.4" />
        </g>
      </svg>

      <span class="condosmart-logo-text">
        <span class="text-prefix">Condo</span><span class="text-suffix">Smart</span>
      </span>
    </div>

    <div class="desc">
      Passa il mouse sopra il logo per testare il volo corretto:<br>
      Ora i fogli nascono <strong>esattamente dalle finestre e dalle intercapedini</strong> dei condomini e non più in alto all'infuori del logo.
    </div>
  </div>

  <script>
    const btn = document.getElementById('toggleBg');
    btn.addEventListener('click', () => {
      document.body.classList.toggle('light-mode');
    });
  </script>
</body>
</html>
